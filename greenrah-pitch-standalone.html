/* 2. TOKENS ----------------------------------------------------------- */
:root,
:root[data-theme="dark"] {
  --bg: #07130b;
  --surface: #102217;
  --elevated: #183526;
  --text: #f4f7ef;
  --muted: #a8b6a5;
  --cool: #6fbe63;
  --on-primary: #07130b;
  --hot: #f4b63f;
  --line: rgba(244, 247, 239, 0.14);
  /* Accessible mode only. Brief gives the light value; this lighter tint keeps AA contrast on dark. */
  --access: #5aa6e6;
  /* Text-safe hot colour: same as --hot on dark, darker on light for WCAG AA */
  --hot-ink: #f4b63f;
  --letterbox: #030805;
  --device: #2b3f33;
  --device-base: #34493c;

  /* map palette */
  --map-sun: #3f3519;
  --map-shade: rgba(2, 9, 4, 0.7);
  --map-block: #1d3727;
  --map-block-2: #234331;
  --map-block-3: #2a4f3a;
  --map-park: #173c22;
  --map-tree: #2e6a37;
  --map-river: #10242a;

  --font: "Space Grotesk", ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --t-slide: 700ms;
  --t-frag: 550ms;
  --r-card: 24px;
  --r-ctl: 14px;
}

:root[data-theme="light"] {
  --bg: #f4f7ef;
  --surface: #ffffff;
  --elevated: #e8f0e6;
  --text: #0e1c12;
  --muted: #3f5240;
  --cool: #3f8f4e;
  --on-primary: #0e1c12;
  --hot: #c98512;
  --line: rgba(14, 28, 18, 0.12);
  --access: #2b7bbf;
  --hot-ink: #8a5a0a;
  --letterbox: #dfe6d9;
  --device: #1c2a21;
  --device-base: #c9d3c6;

  --map-sun: #f6e6bf;
  --map-shade: rgba(14, 28, 18, 0.22);
  --map-block: #d7e2d2;
  --map-block-2: #cad8c4;
  --map-block-3: #bccdb5;
  --map-park: #cfe4c5;
  --map-tree: #8dbf80;
  --map-river: #d3e2e5;
}

/* 3. BASE ------------------------------------------------------------- */
*,
*::before,
*::after { box-sizing: border-box; }

html,
body {
  margin: 0;
  height: 100%;
  background: var(--letterbox);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body { overflow: hidden; }

h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

:focus-visible { outline: 3px solid var(--cool); outline-offset: 3px; border-radius: 8px; }

.noscript { position: fixed; inset: 0; display: grid; place-items: center; font-size: 28px; padding: 40px; text-align: center; }

.i {
  width: 1em; height: 1em;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.viewport { position: fixed; inset: 0; overflow: hidden; background: var(--letterbox); }

.stage {
  width: 1920px;
  height: 1080px;
  background: var(--bg);
  overflow: hidden;
  font-size: 28px;
  line-height: 1.35;
}

.stage--main {
  position: absolute;
  left: 50%;
  top: 50%;
  transform-origin: center center;
  transform: translate(-50%, -50%);
}

.slides { position: absolute; inset: 0; }

/* Slides: fade + small slide, direction aware */
.slide {
  position: absolute;
  inset: 0;
  padding: 92px 120px 128px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  visibility: hidden;
  transform: translateX(48px) scale(0.985);
  transition: opacity var(--t-slide) var(--ease), transform var(--t-slide) var(--ease), visibility 0s linear var(--t-slide);
}
.slide.is-past { transform: translateX(-48px) scale(0.985); }
.slide.is-active {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity var(--t-slide) var(--ease) 80ms, transform var(--t-slide) var(--ease) 80ms, visibility 0s;
}

/* Pause every CSS animation that is not on screen */
.slide:not(.is-active) *,
.slide:not(.is-active) { animation-play-state: paused !important; }

/* Fragments (step reveals) */
.frag {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity var(--t-frag) var(--ease), transform var(--t-frag) var(--ease);
}
.frag--fade { transform: none; }
.frag.is-shown { opacity: 1; transform: none; }

/* Enter stagger for groups of cards */
.stagger {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity 600ms var(--ease), transform 600ms var(--ease);
  transition-delay: 0ms;
}
.is-active .stagger {
  opacity: 1;
  transform: none;
  transition-delay: calc(180ms + var(--i, 0) * 90ms);
}

/* 4. SHARED COMPONENTS ------------------------------------------------ */
.slide-head { margin-bottom: 44px; }
.kicker {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-size: 28px;
  font-weight: 600;
  color: var(--cool);
  letter-spacing: 0.01em;
}
.kicker::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: currentColor; }
.title {
  margin-top: 16px;
  font-size: 76px;
  line-height: 1.04;
  font-weight: 700;
  letter-spacing: -0.025em;
  max-width: 1500px;
  text-wrap: balance;
}
.body {
  margin-top: 24px;
  font-size: 32px;
  line-height: 1.4;
  color: var(--muted);
  max-width: 980px;
  text-wrap: pretty;
}
.accent { color: var(--cool); font-weight: 600; }

/* Placeholder: clearly styled, hot colour, easy to spot */
.ph {
  display: inline-block;
  padding: 2px 14px;
  border: 2px dashed var(--hot);
  border-radius: 12px;
  color: var(--hot-ink);
  background: color-mix(in srgb, var(--hot) 10%, transparent);
  font-weight: 600;
  font-size: 0.8em;
  line-height: 1.35;
  letter-spacing: 0;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
}
.card-title { font-size: 36px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
.card-text { font-size: 28px; color: var(--muted); line-height: 1.35; margin-top: 10px; }

.icon-badge {
  display: inline-grid;
  place-items: center;
  width: 76px;
  height: 76px;
  border-radius: 20px;
  background: var(--elevated);
  color: var(--cool);
  font-size: 42px;
  flex: none;
}
.icon-badge--sm { width: 60px; height: 60px; border-radius: 16px; font-size: 32px; }
.icon-badge--solid { background: var(--cool); color: var(--on-primary); }
.icon-badge--hot { color: var(--hot); background: color-mix(in srgb, var(--hot) 14%, var(--surface)); }
.icon-badge--access { color: var(--access); background: color-mix(in srgb, var(--access) 16%, var(--surface)); }
.icon-badge--muted { color: var(--muted); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--elevated);
  font-size: 24px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 250ms var(--ease), color 250ms var(--ease), border-color 250ms var(--ease);
}
.pill small { font-size: 22px; font-weight: 500; opacity: 0.8; }
.pill.is-active { background: var(--cool); color: var(--on-primary); border-color: transparent; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 22px;
  border-radius: var(--r-ctl);
  border: 1px solid var(--line);
  background: var(--elevated);
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
}
.btn--primary { background: var(--cool); color: var(--on-primary); border-color: transparent; }

.status {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  padding: 0 18px;
  border-radius: 999px;
  font-size: 24px;
  font-weight: 600;
  white-space: nowrap;
}
.status--live { background: var(--cool); color: var(--on-primary); }
.status--planned { border: 2px solid var(--line); color: var(--muted); }

/* Logo: swap the two PNGs with the theme */
.logo { display: inline-block; line-height: 0; }
.logo img { height: 100%; width: auto; }
.logo-on-light { display: none !important; }
[data-theme="light"] .logo-on-dark { display: none !important; }
[data-theme="light"] .logo-on-light { display: block !important; }

/* Split layout: text left, visual right */
.split {
  display: grid;
  grid-template-columns: 600px 1fr;
  gap: 64px;
  flex: 1;
  min-height: 0;
  align-items: center;
}
.split .title { font-size: 68px; }
.split .slide-head { margin-bottom: 36px; }
.split-text { align-self: center; }
.split--wide-map { grid-template-columns: 700px 1fr; }

/* Map cards */
.map-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: 18px 18px 20px;
}
.map-card > svg { display: block; width: 100%; height: auto; border-radius: 16px; }
.map-chip {
  position: absolute;
  top: 34px;
  left: 34px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 20px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 24px;
  font-weight: 600;
}
.map-chip .i { font-size: 28px; color: var(--cool); }
.map-chip--note { color: var(--muted); }
.map-chip--note .i { color: var(--muted); }
.map-chip--clock { font-size: 24px; }
.map-chip--clock .clock-time { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
.map-chip--clock .clock-label { color: var(--muted); font-weight: 500; }
.map-caption { margin-top: 12px; font-size: 24px; color: var(--muted); padding-left: 6px; }
.map-title { font-size: 36px; font-weight: 700; margin: 6px 6px 14px; }

.map-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 34px;
  margin-top: 16px;
  padding-left: 6px;
  font-size: 24px;
  font-weight: 500;
  color: var(--muted);
}
.lg { display: inline-flex; align-items: center; gap: 12px; }
.lg i { display: inline-block; width: 44px; height: 10px; border-radius: 5px; background: var(--muted); }
.lg--fast i { background: var(--hot); }
.lg--cool i { background: var(--cool); height: 14px; border-radius: 7px; }
.lg--shade i { background: var(--map-shade); height: 22px; width: 32px; border-radius: 6px; outline: 1px solid var(--line); }
.lg--covered i { background: var(--cool); height: 22px; width: 32px; border-radius: 6px; }

/* City map drawing */
.city-ground { fill: var(--map-sun); }
.city-river { fill: var(--map-river); }
.city-park { fill: var(--map-park); }
.city-shadows { fill: var(--map-shade); }
.city-blocks polygon { fill: var(--map-block); stroke: var(--map-block); stroke-width: 2; stroke-linejoin: round; }
.city-blocks .b2 { fill: var(--map-block-2); stroke: var(--map-block-2); }
.city-blocks .b3 { fill: var(--map-block-3); stroke: var(--map-block-3); }
.city-trees circle { fill: var(--map-tree); }

.route-casing { fill: none; stroke: var(--surface); stroke-linecap: round; stroke-linejoin: round; stroke-width: 20; opacity: 0.9; }
.route {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1 1;
  stroke-dashoffset: 1;
  transition: stroke-dashoffset 1400ms var(--ease), opacity 600ms var(--ease);
}
.route--fast { stroke: var(--hot); stroke-width: 10; }
.route--cool { stroke: var(--cool); stroke-width: 14; }
.route--cool-casing { stroke-width: 24; }
.route--access { stroke: var(--access); stroke-width: 14; }
.route--access-casing { stroke-width: 24; }
.route--heat { fill: none; stroke: var(--hot); stroke-width: 12; stroke-linecap: round; opacity: 0; }

.marker circle { fill: var(--text); stroke: var(--surface); stroke-width: 6; }
.marker text { fill: var(--text); font-size: 26px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 8px; stroke-linejoin: round; }

/* Sun dial */
.sundial { display: block; }
.dial-ring { fill: var(--elevated); stroke: var(--line); stroke-width: 2; }
.dial-path { fill: none; stroke: var(--hot); stroke-width: 3; stroke-dasharray: 4 7; stroke-linecap: round; opacity: 0.7; }
.dial-n { fill: var(--muted); font-size: 18px; font-weight: 700; }
.dial-centre { fill: var(--muted); }
.dial-sun circle { fill: var(--hot); stroke: var(--surface); stroke-width: 4; }
.sundial.is-night .dial-sun { opacity: 0.2; }

/* 5. SLIDES ----------------------------------------------------------- */

/* 1 Title */
.slide--title { justify-content: center; padding-left: 150px; }
.title-bg { position: absolute; inset: 0; opacity: 0.42; }
[data-theme="light"] .title-bg { opacity: 0.3; }
@media print { .title-bg { opacity: 0.3; } }
.title-bg .city { width: 100%; height: 100%; }
.title-content { position: relative; max-width: 1400px; }
.title-logo { height: 118px; margin-bottom: 56px; }
.title-tag { font-size: 148px; line-height: 0.98; font-weight: 700; letter-spacing: -0.035em; white-space: nowrap; }
.title-body { margin-top: 36px; font-size: 40px; line-height: 1.35; color: var(--muted); max-width: 880px; }
.title-footer { margin-top: 48px; font-size: 28px; font-weight: 600; color: var(--cool); }
.title-sun {
  position: absolute;
  right: 110px;
  top: 96px;
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 18px 28px 18px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
}
.title-sun .sundial { width: 116px; height: 116px; }
.title-clock { display: flex; flex-direction: column; }
.title-clock .clock-time { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.title-clock .clock-label { font-size: 24px; color: var(--muted); }

.is-active .title-content > * { animation: rise 900ms var(--ease) both; }
.is-active .title-content > :nth-child(2) { animation-delay: 120ms; }
.is-active .title-content > :nth-child(3) { animation-delay: 240ms; }
.is-active .title-content > :nth-child(4) { animation-delay: 360ms; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

/* 2 Problem */
.slide--problem .route--fast { stroke: var(--cool); stroke-dashoffset: 0; }
.heat-meter { max-width: 520px; }
.heat-meter-top { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 600; color: var(--hot-ink); }
.heat-meter-top .i { font-size: 36px; color: var(--hot); }
.heat-bar { margin-top: 16px; height: 16px; border-radius: 8px; background: var(--elevated); overflow: hidden; }
.heat-bar i { display: block; height: 100%; width: 100%; background: var(--hot); border-radius: 8px; transform-origin: left center; transform: scaleX(0.04); }

/* 3 Why now */
.why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; flex: 1; min-height: 0; }
.why-card { padding: 28px 26px; display: flex; flex-direction: column; }
.why-card .card-title { margin-top: 20px; font-size: 32px; }
.why-card .card-text { font-size: 24px; }
.why-stat { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--line); }
.stat-num { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: var(--cool); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 22px; margin-top: 8px; line-height: 1.3; }
.stat-source { font-size: 20px; color: var(--muted); margin-top: 6px; }
.stat-ph { font-size: 26px; }

/* 4 Solution */
.slide--solution.is-active .route--fast { stroke-dashoffset: 0; transition-delay: 350ms; }
.slide--solution.s1 .route--cool { stroke-dashoffset: 0; }
.slide--solution.s1 .route--fast { opacity: 0.45; transition-delay: 0ms; }
.slide--solution.s1 .route--fast-casing { opacity: 0.4; }

/* 5 Engine */
.slide-head--row { margin-bottom: 36px; }
.slide--engine .body { margin-top: 14px; }
.engine { position: relative; width: 1680px; height: 580px; }
.engine-links { position: absolute; inset: 0; width: 1680px; height: 580px; overflow: visible; }
.link { fill: none; stroke: var(--line); stroke-width: 4; }
.link-flow { fill: none; stroke: var(--cool); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 6 18; animation: flow 1.4s linear infinite; }
.link-flow--out { stroke-width: 5; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.sig {
  position: absolute;
  left: 0;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 22px 0 18px;
}
.sig-num {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 999px;

  font-weight: 700;

}
.sig-text { display: flex; flex-direction: column; min-width: 0; }
.sig-text strong { font-size: 30px; line-height: 1.15; }
.sig-text small { font-size: 24px; color: var(--muted); line-height: 1.25; }
.engine-core {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  border-radius: 50%;

  transition: background-color 700ms var(--ease), border-color 700ms var(--ease), color 700ms var(--ease);
}
.engine-core strong { font-size: 28px; line-height: 1.15; max-width: 200px; }
.engine-icon { font-size: 64px; color: var(--muted); transition: color 700ms var(--ease); }
.engine-ring {
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  border: 3px solid var(--cool);
  opacity: 0;
  transform: scale(0.92);
  transition: opacity 700ms var(--ease), transform 700ms var(--ease);
}
.slide--engine.s1 .engine-core { border-style: solid; }
.slide--engine.s6 .engine-core { background: var(--cool); color: var(--on-primary); border-color: transparent; }
.slide--engine.s6 .engine-icon { color: var(--on-primary); }
.slide--engine.s6 .engine-ring { opacity: 0.5; transform: none; }
.engine-caption {
  position: absolute;
  width: 460px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 24px;
  color: var(--muted);
  text-align: left;
}
.out { position: absolute; display: flex; align-items: center; gap: 18px; padding: 0 22px; font-size: 32px; }
.out strong { font-weight: 700; }
.engine-footer { position: absolute; font-size: 28px; color: var(--muted); line-height: 1.35; }

/* 6 Heat Smart */
.time-card { padding: 26px 28px 28px; }
.time-top { display: flex; align-items: center; gap: 24px; }
.sundial--hs { width: 132px; height: 132px; }
.time-read { display: flex; flex-direction: column; }
.time-big { font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.time-phrase { font-size: 26px; color: var(--muted); margin-top: 8px; min-height: 35px; }
.time-label { display: block; margin-top: 22px; font-size: 24px; font-weight: 600; color: var(--muted); }
.time-slider {
  width: 100%;
  height: 44px;
  margin: 6px 0 14px;
  background: transparent;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  touch-action: none;
}
.time-slider::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: var(--elevated); border: 1px solid var(--line); }
.time-slider::-moz-range-track { height: 12px; border-radius: 6px; background: var(--elevated); border: 1px solid var(--line); }
.time-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; margin-top: -13px; border-radius: 50%; background: var(--hot); border: 5px solid var(--surface); }
.time-slider::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--hot); border: 5px solid var(--surface); }
.presets { display: flex; flex-wrap: wrap; gap: 10px; }
.route-cand { opacity: 0; transition: opacity 700ms var(--ease); }
.route-cand .route { stroke-dashoffset: 0; }
.route-cand.is-rec { opacity: 1; }
.slide--heatsmart .route--fast { stroke-dashoffset: 0; opacity: 0.6; }
.slide--heatsmart .map-card { align-self: center; }

/* 7 Accessible */
.legend-list { display: flex; flex-direction: column; gap: 16px; }
.legend-list .lg { gap: 18px; font-size: 30px; font-weight: 600; }
.slide--accessible .route--fast,
.slide--accessible .route--cool { stroke-dashoffset: 0; }
.slide--accessible .route--fast { opacity: 0.6; }
.flag-seg { fill: none; stroke-linecap: round; opacity: 0; transition: opacity 600ms var(--ease); }
.flag-seg--stairs { stroke: var(--hot); stroke-width: 30; stroke-dasharray: 3 9; stroke-linecap: butt; }
.flag-seg--steep { stroke: var(--hot); stroke-width: 34; opacity: 0; }
.badge { opacity: 0; transition: opacity 600ms var(--ease); }
.badge rect { fill: var(--surface); stroke: var(--hot); stroke-width: 3; }
.badge .i { color: var(--hot); stroke-width: 2; }
.slide--accessible.s1 .flag-seg--stairs { opacity: 0.9; }
.slide--accessible.s1 .flag-seg--steep { opacity: 0.35; }
.slide--accessible.s1 .badge { opacity: 1; }
.slide--accessible.s2 .flag-seg,
.slide--accessible.s2 .badge { opacity: 0.12; }
.slide--accessible.s2 .route--fast,
.slide--accessible.s2 .route--cool,
.slide--accessible.s2 .route--fast-casing,
.slide--accessible.s2 .route--cool-casing { opacity: 0.12; }
.slide--accessible.s2 .route--access { stroke-dashoffset: 0; transition-delay: 250ms; }
.slide--accessible .route--access-casing { opacity: 0; transition: opacity 600ms var(--ease); }
.slide--accessible.s2 .route--access-casing { opacity: 0.9; }
.mode-tabs {
  position: absolute;
  top: 34px;
  left: 34px;
  display: inline-flex;
  padding: 6px;
  gap: 4px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.mode-tab {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 999px;
  font-size: 24px;
  font-weight: 600;
  color: var(--muted);
  transition: background-color 500ms var(--ease), color 500ms var(--ease);
}
.mode-tab .i { font-size: 28px; }
.mode-tab--heat { background: var(--cool); color: var(--on-primary); }
.slide--accessible.s1 .mode-tab--heat { background: transparent; color: var(--muted); }
.slide--accessible.s1 .mode-tab--access { background: var(--access); color: #ffffff; }
[data-theme="dark"] .slide--accessible.s1 .mode-tab--access { color: #07130b; }

/* 8 Planning */
.tile-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 28px; flex: 1; min-height: 0; }
.tile { padding: 32px 30px; display: flex; flex-direction: column; }
.tile .card-title { margin-top: auto; padding-top: 20px; font-size: 34px; }
.tile .card-text { font-size: 26px; }

/* 9 Web and Android */
.platforms { display: grid; grid-template-columns: 1080px 1fr; gap: 64px; flex: 1; min-height: 0; align-items: center; }
.platforms .title { font-size: 68px; }
.devices { position: relative; height: 820px; }
.laptop { position: absolute; left: 30px; top: 110px; width: 940px; }
.laptop-screen {
  border: 16px solid var(--device);
  border-bottom-width: 22px;
  border-radius: 24px 24px 12px 12px;
  background: var(--device);
  overflow: hidden;
  aspect-ratio: 16 / 10;
}
.laptop-screen img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.laptop-base { height: 24px; margin: 0 -44px; border-radius: 4px 4px 18px 18px; background: var(--device-base); }
.phone {
  position: absolute;
  right: 0;
  top: 190px;
  width: 300px;
  border: 12px solid var(--device);
  border-radius: 44px;
  background: var(--device);
  overflow: hidden;
}
.phone-screen { border-radius: 32px; overflow: hidden; aspect-ratio: 585 / 1266; }
.phone-screen img { width: 100%; height: 100%; object-fit: cover; }
.devices-caption { position: absolute; left: 0; bottom: 0; }
.is-active .laptop { animation: from-left 900ms var(--ease) both 150ms; }
.is-active .phone { animation: from-right 900ms var(--ease) both 350ms; }
@keyframes from-left { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@keyframes from-right { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
.platform-list { display: flex; flex-direction: column; gap: 14px; }
.platform {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 14px 18px 14px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
}
.platform-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.platform-text strong { font-size: 30px; line-height: 1.15; }
.platform-text small { font-size: 24px; color: var(--muted); }

/* 10 Audience */
.audience { display: grid; grid-template-columns: 860px 1fr; gap: 56px; flex: 1; min-height: 0; }
.audience-left { display: flex; flex-direction: column; }
.audience .title { font-size: 68px; }
.persona-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; flex: 1; min-height: 0; }
.persona { padding: 28px 30px; display: flex; flex-direction: column; }
.persona .card-title { margin-top: auto; padding-top: 16px; }
.europe-card { display: flex; flex-direction: column; align-self: stretch; }
.europe-card .europe { flex: 1; min-height: 0; width: 100%; }
.europe { display: block; }
.eu-other path { fill: var(--elevated); stroke: var(--surface); stroke-width: 1.2; }
.eu-covered path { fill: var(--elevated); stroke: var(--surface); stroke-width: 1.2; transition: fill 900ms var(--ease); }
.slide--audience.s1 .eu-covered path { fill: var(--cool); transition-delay: 350ms; }
.eu-pin { opacity: 0; transition: opacity 600ms var(--ease) 900ms; }
.slide--audience.s1 .eu-pin { opacity: 1; }
.eu-pin-dot { fill: var(--hot); stroke: var(--surface); stroke-width: 4; }
.eu-pin-pulse { fill: none; stroke: var(--hot); stroke-width: 3; transform-box: fill-box; transform-origin: center; opacity: 0; }
.slide--audience.s1 .eu-pin-pulse { animation: pulse 2.4s var(--ease) 1.2s 3; }
@keyframes pulse { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(3.2); } }
.eu-pin text { fill: var(--text); font-size: 30px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 8px; stroke-linejoin: round; }

/* 11 Different */
.compare-wrap { position: relative; }
.compare-highlight {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 680px;
  width: 250px;
  border-radius: var(--r-card);
  background: color-mix(in srgb, var(--cool) 12%, var(--surface));

}
.compare { position: relative; width: 100%; border-collapse: collapse; table-layout: fixed; }
.compare th, .compare td { height: 104px; padding: 0 24px; text-align: center; font-size: 30px; }
.compare thead th { height: 92px; font-size: 30px; font-weight: 700; color: var(--muted); }
.compare thead th.col-brand { color: var(--cool); }
.compare th:first-child { width: 680px; }
.compare tbody th { text-align: left; font-weight: 500; }
.compare tbody tr { border-top: 1px solid var(--line); }
.mark { display: inline-grid; place-items: center; }
.mark .i { font-size: 44px; stroke-width: 2.25; }
.mark--yes { color: var(--text); }
.mark--brand { width: 64px; height: 64px; border-radius: 999px; background: var(--cool); color: var(--on-primary); }
.mark--brand .i { font-size: 38px; }
.mark--no { color: var(--muted); opacity: 0.7; }
.mark--info { font-size: 24px; line-height: 1.2; color: var(--muted); padding: 6px 16px; border: 2px solid var(--line); border-radius: 999px; }
.footnote { margin-top: 22px; font-size: 24px; color: var(--muted); }

/* 12 Traction */
.fact-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.fact { padding: 28px 30px; }
.fact-value { margin-top: 18px; font-size: 64px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; color: var(--cool); font-variant-numeric: tabular-nums; }
.fact-label { margin-top: 8px; font-size: 26px; color: var(--muted); line-height: 1.3; }

.coverage-item .icon-badge { grid-row: span 2; }
.coverage-value { font-size: 72px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: var(--cool); font-variant-numeric: tabular-nums; }
.coverage-item .fact-label { margin-top: 6px; }
.event {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  margin-top: 28px;
  align-self: flex-start;
  min-height: 60px;
  padding: 0 26px;
  border-radius: 999px;
  background: var(--elevated);
  font-size: 28px;
  font-weight: 600;
}
.event .i { font-size: 32px; color: var(--cool); }

/* 13 Cities */
.insights { display: grid; gap: 10px; margin: 0 0 20px; }
.insight { display: flex; align-items: flex-start; gap: 12px; font-size: 24px; line-height: 1.3; }
.insight .i { flex: none; font-size: 28px; margin-top: 2px; color: var(--cool); }
.use-cases { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.use-case {
  display: flex;

  padding: 8px 16px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 26px;
  font-weight: 600;
  line-height: 1.2;
}

.lisbon-card { align-self: center; justify-self: center; width: 720px; }
.lisbon { display: block; width: 100%; height: auto; }
.lx-cells rect { fill: var(--hot); opacity: 0; transition: opacity 500ms var(--ease); }
.slide--cities.is-active .lx-cells rect { opacity: 1; }
.lx-parishes path { fill: none; stroke: var(--text); stroke-opacity: 0.35; stroke-width: 1.6; stroke-linejoin: round; }
.lg-scale { display: inline-flex; align-items: center; gap: 14px; }
.lg-scale i { display: inline-block; width: 220px; height: 18px; border-radius: 9px; background: linear-gradient(90deg, color-mix(in srgb, var(--hot) 10%, var(--surface)), var(--hot)); }

/* 14 Model */
.plan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }

.plan-top { display: flex; align-items: center; justify-content: space-between; }
.plan-price { margin-top: 22px; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.plan--free { border: 2px solid var(--cool); }
.plan--free .plan-price { color: var(--cool); }
.plan .card-title { margin-top: 10px; font-size: 32px; }
.plan .card-text { font-size: 26px; }
.timeline { position: relative; margin: 64px 150px 0; height: 200px; }
.tl-line { position: absolute; left: 0; right: 0; top: 17px; height: 6px; border-radius: 3px; background: var(--elevated); overflow: hidden; }
.tl-line i { display: block; height: 100%; width: 100%; background: var(--cool); transform-origin: left center; transform: scaleX(0); transition: transform 1400ms var(--ease) 150ms; }
.slide--model.s1 .tl-line i { transform: scaleX(1); }
.timeline ol { position: absolute; inset: 0; }
.milestone {
  position: absolute;
  top: 0;
  width: 300px;
  margin-left: -150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 600ms var(--ease), transform 600ms var(--ease);
}
.slide--model.s1 .milestone { opacity: 1; transform: none; }
.ms-dot { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 6px solid var(--cool); }
.milestone--now .ms-dot { background: var(--cool); }
.ms-label { margin-top: 12px; font-size: 22px; font-weight: 700; color: var(--cool); letter-spacing: 0.04em; text-transform: uppercase; }
.milestone strong { font-size: 28px; line-height: 1.2; margin-top: 4px; }
.milestone small { font-size: 24px; color: var(--muted); margin-top: 6px; }

/* ---- js/city-model.js ---- */
/* =====================================================================
   GreenRah pitch: illustrative city model
   ---------------------------------------------------------------------
   A simplified street grid with real sun geometry for Lisbon in July.
   Used by the Solution, Heat Smart, Accessible and Title slides.

   Nothing here is GreenRah production data. The streets are invented;
   only the sun angles are real. Shade per route is computed from the
   building shadows below, so "which route is cooler" is honest for this
   drawing, and no percentage is ever shown on screen.
   ===================================================================== */
(function (root) {
  'use strict';

  var W = 1000;
  var H = 620;
  var COLS = [70, 250, 430, 610, 790, 930]; // vertical street centre lines
  var ROWS = [70, 230, 390, 550];           // horizontal street centre lines
  // Narrow side streets, plus two wide sunny main roads: the east boulevard
  // (last column) and the riverside avenue (last row).
  var COL_W = [18, 18, 18, 18, 18, 50];
  var ROW_W = [18, 18, 18, 50];
  var STREET = 18;
  var PARK_CELL = { col: 2, row: 0 };       // a garden block, trees only
  var RIVER_Y = 585;                         // the river runs along the bottom

  /* ---------- small geometry helpers ---------- */

  function rand(seed) {
    // deterministic pseudo random in [0, 1)
    var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function cross(o, a, b) {
    return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  }

  function convexHull(points) {
    var pts = points.slice().sort(function (p, q) {
      return p[0] === q[0] ? p[1] - q[1] : p[0] - q[0];
    });
    if (pts.length < 3) return pts;
    var lower = [];
    var upper = [];
    var i;
    for (i = 0; i < pts.length; i++) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], pts[i]) <= 0) lower.pop();
      lower.push(pts[i]);
    }
    for (i = pts.length - 1; i >= 0; i--) {
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], pts[i]) <= 0) upper.pop();
      upper.push(pts[i]);
    }
    upper.pop();
    lower.pop();
    return lower.concat(upper);
  }

  function insideConvex(poly, p) {
    // poly is counter clockwise (from convexHull, in a y-down space it is CW, sign is consistent)
    var sign = 0;
    for (var i = 0; i < poly.length; i++) {
      var c = cross(poly[i], poly[(i + 1) % poly.length], p);
      if (c === 0) continue;
      var s = c > 0 ? 1 : -1;
      if (sign === 0) sign = s;
      else if (s !== sign) return false;
    }
    return true;
  }

  function area(poly) {
    var s = 0;
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i];
      var q = poly[(i + 1) % poly.length];
      s += p[0] * q[1] - q[0] * p[1];
    }
    return Math.abs(s) / 2;
  }

  /* ---------- the city ---------- */

  function buildCity() {
    var buildings = [];
    var trees = [];
    var seed = 1;
    for (var c = 0; c < COLS.length - 1; c++) {
      for (var r = 0; r < ROWS.length - 1; r++) {
        var x0 = COLS[c] + COL_W[c] / 2;
        var x1 = COLS[c + 1] - COL_W[c + 1] / 2;
        var y0 = ROWS[r] + ROW_W[r] / 2;
        var y1 = ROWS[r + 1] - ROW_W[r + 1] / 2;
        if (c === PARK_CELL.col && r === PARK_CELL.row) {
          for (var t = 0; t < 14; t++) {
            trees.push({
              x: x0 + 14 + rand(t * 3.1) * (x1 - x0 - 28),
              y: y0 + 14 + rand(t * 7.7) * (y1 - y0 - 28),
              r: 9 + rand(t * 1.9) * 6,
              h: 8
            });
          }
          continue;
        }
        // split each block into 2 x 2 buildings with a small gap
        var mx = (x0 + x1) / 2 + (rand(seed++) - 0.5) * 30;
        var my = (y0 + y1) / 2 + (rand(seed++) - 0.5) * 30;
        var parts = [
          [x0, y0, mx - 2, my - 2],
          [mx + 2, y0, x1, my - 2],
          [x0, my + 2, mx - 2, y1],
          [mx + 2, my + 2, x1, y1]
        ];
        for (var k = 0; k < parts.length; k++) {
          var p = parts[k];
          var rect = [[p[0], p[1]], [p[2], p[1]], [p[2], p[3]], [p[0], p[3]]];
          var h = 16 + Math.round(rand(seed++) * 18);
          if (area(rect) > 140) buildings.push({ poly: rect, h: h });
        }
      }
    }
    return { buildings: buildings, trees: trees };
  }

  var CITY = buildCity();

  /* ---------- routes (polylines on street centre lines) ---------- */

  var START = [70, 550];
  var END = [930, 70];
  // The fastest walk follows the two wide main roads (fewest crossings).
  // Cooler candidates use the narrow side streets.
  var ROUTES = {
    fastest: { pts: [START, [930, 550], END], width: 50 },
    north: { pts: [START, [70, 70], END], width: STREET },
    inner: { pts: [START, [70, 390], [610, 390], [610, 70], END], width: STREET },
    mid: { pts: [START, [250, 550], [250, 230], [790, 230], [790, 70], END], width: STREET }
  };
  var COOLER_CANDIDATES = ['north', 'inner', 'mid'];

  // Accessible story: stairs and a steep block sit on the cooler route at
  // 16:30; the gentler path avoids both and still keeps some shade.
  var STAIRS = [
    { a: [250, 470], b: [250, 400] }
  ];
  var STEEP = [
    { a: [470, 230], b: [610, 230] }
  ];
  var ACCESSIBLE = { pts: [START, [430, 550], [430, 390], [790, 390], [790, 70], END], width: STREET };

  /* ---------- sun: real angles for Lisbon, 15 July ---------- */

  var LAT = 38.72 * Math.PI / 180;
  var LON = -9.14;
  var TZ = 1; // WEST, UTC+1 in summer
  var DOY = 196;

  function sunAt(clockHours) {
    var decl = 23.44 * Math.PI / 180 * Math.sin(2 * Math.PI * (284 + DOY) / 365);
    var B = 2 * Math.PI * (DOY - 81) / 364;
    var eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);

    var Hr = (15 * (solar - 12)) * Math.PI / 180;
    var sinEl = Math.sin(LAT) * Math.sin(decl) + Math.cos(LAT) * Math.cos(decl) * Math.cos(Hr);
    var el = Math.asin(sinEl);
    var az = Math.atan2(Math.sin(Hr), Math.cos(Hr) * Math.sin(LAT) - Math.tan(decl) * Math.cos(LAT)) + Math.PI;

  }

  function shadowVector(sun, h) {
    var el = Math.max(sun.elevation, 4) * Math.PI / 180;
    var len = Math.min(h / Math.tan(el), 420);
    var az = sun.azimuth * Math.PI / 180;
    // x east, y south (SVG); shadow points away from the sun
    return [-Math.sin(az) * len, Math.cos(az) * len];
  }

  function circlePoly(x, y, r) {
    var out = [];
    for (var i = 0; i < 12; i++) {
      var a = i / 12 * Math.PI * 2;
      out.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
    }
    return out;
  }

  /** A plain block grid (used for the title background). */
  function gridBuildings(o) {
    var out = [];
    var seed = o.seed || 7;
    for (var y = o.y0; y < o.y1; y += o.cellH) {
      for (var x = o.x0; x < o.x1; x += o.cellW) {
        var bx0 = x + o.street / 2;
        var bx1 = x + o.cellW - o.street / 2;
        var by0 = y + o.street / 2;
        var by1 = y + o.cellH - o.street / 2;
        var mx = (bx0 + bx1) / 2 + (rand(seed++) - 0.5) * o.cellW * 0.25;
        [[bx0, by0, mx - 3, by1], [mx + 3, by0, bx1, by1]].forEach(function (p) {
          out.push({
            poly: [[p[0], p[1]], [p[2], p[1]], [p[2], p[3]], [p[0], p[3]]],
            h: o.hMin + Math.round(rand(seed++) * (o.hMax - o.hMin))
          });
        });
      }
    }
    return out;
  }

  function shadowsAt(clockHours, buildings, trees) {
    var sun = sunAt(clockHours);
    if (sun.elevation <= 0) return { sun: sun, polys: [] };
    var polys = [];
    (buildings || CITY.buildings).forEach(function (b) {
      var v = shadowVector(sun, b.h);
      var moved = b.poly.map(function (p) { return [p[0] + v[0], p[1] + v[1]]; });
      polys.push(convexHull(b.poly.concat(moved)));
    });
    (trees || (buildings ? [] : CITY.trees)).forEach(function (t) {
      var v = shadowVector(sun, t.h);
      var c = circlePoly(t.x, t.y, t.r);
      var moved = c.map(function (p) { return [p[0] + v[0], p[1] + v[1]]; });
      polys.push(convexHull(c.concat(moved)));
    });
    return { sun: sun, polys: polys };
  }

  function inShade(polys, p) {
    for (var i = 0; i < polys.length; i++) {
      if (insideConvex(polys[i], p)) return true;
    }
    return false;
  }

  function routeShade(route, polys) {
    var hit = 0;
    var total = 0;
    var lateral = [-route.width * 0.32, 0, route.width * 0.32];
    for (var i = 0; i < route.pts.length - 1; i++) {
      var a = route.pts[i];
      var b = route.pts[i + 1];
      var len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      var n = [-(b[1] - a[1]) / len, (b[0] - a[0]) / len];
      var steps = Math.max(1, Math.round(len / 8));
      for (var s = 0; s <= steps; s++) {
        var t = s / steps;
        var base = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
        for (var l = 0; l < lateral.length; l++) {
          total++;
          if (inShade(polys, [base[0] + n[0] * lateral[l], base[1] + n[1] * lateral[l]])) hit++;
        }
      }
    }
    return total ? hit / total : 0;
  }

  /** Which cooler candidate has the most shade at this clock time. */
  function coolerAt(clockHours) {
    var sh = shadowsAt(clockHours);
    var best = null;
    var bestScore = -1;
    var scores = {};
    COOLER_CANDIDATES.forEach(function (id) {
      var s = routeShade(ROUTES[id], sh.polys);
      scores[id] = s;
      if (s > bestScore + 1e-9) { bestScore = s; best = id; }
    });
    scores.fastest = routeShade(ROUTES.fastest, sh.polys);
    return { id: best, scores: scores, sun: sh.sun };
  }

  /* ---------- SVG helpers ---------- */

  function polyPoints(poly) {
    return poly.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  }

  function pathD(pts) {
    return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0] + ' ' + p[1]; }).join(' ');
  }

  function formatClock(h) {
    var hh = Math.floor(h);
    var mm = Math.round((h - hh) * 60);
    if (mm === 60) { hh += 1; mm = 0; }
    return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }

  var api = {
    W: W, H: H, COLS: COLS, ROWS: ROWS, COL_W: COL_W, ROW_W: ROW_W, STREET: STREET, RIVER_Y: RIVER_Y,
    city: CITY, routes: ROUTES, candidates: COOLER_CANDIDATES,
    start: START, end: END, stairs: STAIRS, steep: STEEP, accessible: ACCESSIBLE,
    sunAt: sunAt, shadowsAt: shadowsAt, coolerAt: coolerAt, routeShade: routeShade, gridBuildings: gridBuildings,
    polyPoints: polyPoints, pathD: pathD, formatClock: formatClock
  };

  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.GRCity = api;

  var root = document.documentElement;
  var params = new URLSearchParams(location.search);
  var IS_PRESENTER = params.has('presenter');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function isPlaceholder(v) { return typeof v === 'string' && v.trim().charAt(0) === '['; }

  /** Resolve {ph:key} to its raw value (no markup). */
  function resolve(s) {
    return String(s == null ? '' : s).replace(/\{ph:([\w-]+)\}/g, function (_, k) {
      return C.placeholders[k] != null ? C.placeholders[k] : '[ADD: ' + k + ']';
    });
  }

  /** Copy formatter: escapes HTML, renders {ph:key} and [[accent]]. */
  function fmt(s) {
    var out = esc(s);
    out = out.replace(/\{ph:([\w-]+)\}/g, function (_, k) {
      var v = C.placeholders[k] != null ? C.placeholders[k] : '[ADD: ' + k + ']';
      return isPlaceholder(v) ? '<span class="ph">' + esc(v) + '</span>' : esc(v);
    });
    out = out.replace(/\[\[(.+?)\]\]/g, '<span class="accent">$1</span>');
    return out;
  }

  /** Placeholder-aware text for a raw value (used for stats). */
  function phText(v) {
    return isPlaceholder(v) ? '<span class="ph">' + esc(v) + '</span>' : esc(v);
  }

  function icon(name, cls) {
    return '<svg class="i ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
      (ICONS[name] || '') + '</svg>';
  }

  /** Icon nested inside another SVG, centred at (x, y). */
  function svgIcon(name, x, y, size, cls) {
    return '<svg class="i ' + (cls || '') + '" x="' + (x - size / 2) + '" y="' + (y - size / 2) + '" width="' + size +
      '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  function byId(id) {
    for (var i = 0; i < C.slides.length; i++) if (C.slides[i].id === id) return C.slides[i];
    return {};
  }

  function reduced() { return root.classList.contains('reduce-motion'); }

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  /** requestAnimationFrame tween. Returns a cancel function. */
  function tween(from, to, ms, onUpdate, onDone) {
    if (reduced() || ms <= 0) {
      onUpdate(to);
      if (onDone) onDone();
      return function () {};
    }
    var start = null;
    var raf = 0;
    var cancelled = false;
    function frame(ts) {
      if (cancelled) return;
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / ms);
      onUpdate(from + (to - from) * easeOut(t));
      if (t < 1) raf = requestAnimationFrame(frame);
      else if (onDone) onDone();
    }
    raf = requestAnimationFrame(frame);
    return function () { cancelled = true; cancelAnimationFrame(raf); };
  }

  function store(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, val);
    } catch (e) { /* storage can be blocked on file:// */ }
    return null;
  }

  function logo(cls) {
    return '<span class="logo ' + (cls || '') + '" role="img" aria-label="GreenRah">' +
      '<img class="logo-on-dark" src="' + ASSETS.logoOnDark + '" alt="" draggable="false">' +
      '<img class="logo-on-light" src="' + ASSETS.logoOnLight + '" alt="" draggable="false"></span>';
  }

  function head(s, extraCls) {
    return '<header class="slide-head ' + (extraCls || '') + '">' +
      (s.kicker ? '<p class="kicker">' + fmt(s.kicker) + '</p>' : '') +
      '<h2 class="title">' + fmt(s.title) + '</h2>' +
      (s.body ? '<p class="body">' + fmt(s.body) + '</p>' : '') +
      '</header>';
  }

  function fmtCount(n) {
    return Number(n).toLocaleString('en-GB');
  }

  function countUpIn(el) {
    var nodes = el.querySelectorAll('[data-count]');
    Array.prototype.forEach.call(nodes, function (n) {
      var target = parseFloat(n.getAttribute('data-count'));
      var dec = parseInt(n.getAttribute('data-decimals') || '0', 10);
      tween(0, target, 1100, function (v) {
        n.textContent = v.toLocaleString('en-GB', { minimumFractionDigits: dec, maximumFractionDigits: dec });
      });
    });
  }

  /* =================================================================
     2. SHARED VISUAL BUILDERS
     ================================================================= */

  function shadowD(time, buildings) {
    var sh = City.shadowsAt(time, buildings);
    return sh.polys.map(function (p) {
      return 'M' + p.map(function (q) { return q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join('L') + 'Z';
    }).join('');
  }

  function segD(seg) { return 'M' + seg.a[0] + ' ' + seg.a[1] + 'L' + seg.b[0] + ' ' + seg.b[1]; }

  function routePath(pts, cls, extra) {
    var d = City.pathD(pts);
    return '<path class="route-casing ' + cls + '-casing" d="' + d + '"/>' +
      '<path class="route ' + cls + '" d="' + d + '" pathLength="1" ' + (extra || '') + '/>';
  }

  /**
   * Stylised city map (top down, north up).
   * o.time        clock hours for shadows
   * o.fast        draw the fastest route
   * o.cool        id of the cooler route to draw, or 'all' for every candidate
   * o.heat        draw a hot overlay on the fastest route (problem slide)
   * o.access      draw stairs, steep segment and the gentler path
   * o.markers     draw start / end markers
   * o.labels      {start, end}
   */
  function cityMap(o) {
    var out = [];
    var P = City.COLS[2] + City.STREET / 2;
    var cellW = City.COLS[3] - City.COLS[2] - City.STREET;
    var cellH = City.ROWS[1] - City.ROWS[0] - City.STREET;
    out.push('<svg class="city" viewBox="0 0 ' + City.W + ' ' + City.H + '" aria-hidden="true" focusable="false">');
    out.push('<rect class="city-ground" x="-400" y="-400" width="' + (City.W + 800) + '" height="' + (City.H + 800) + '"/>');
    out.push('<rect class="city-river" x="-400" y="' + City.RIVER_Y + '" width="' + (City.W + 800) + '" height="400"/>');
    out.push('<rect class="city-park" x="' + P + '" y="' + (City.ROWS[0] + City.STREET / 2) + '" width="' + cellW + '" height="' + cellH + '" rx="10"/>');
    out.push('<path class="city-shadows" d="' + shadowD(o.time) + '"/>');
    out.push('<g class="city-blocks">');
    City.city.buildings.forEach(function (b) {
      out.push('<polygon class="' + toneOf(b.h) + '" points="' + City.polyPoints(b.poly) + '"/>');
    });
    out.push('</g><g class="city-trees">');
    City.city.trees.forEach(function (t) {
      out.push('<circle cx="' + t.x.toFixed(1) + '" cy="' + t.y.toFixed(1) + '" r="' + t.r.toFixed(1) + '"/>');
    });
    out.push('</g>');

    out.push('<g class="city-routes">');
    if (o.fast) out.push(routePath(City.routes.fastest.pts, 'route--fast'));
    if (o.heat) out.push('<path class="route route--heat" d="' + City.pathD(City.routes.fastest.pts) + '"/>');
    if (o.cool === 'all') {
      City.candidates.forEach(function (id) {
        out.push('<g class="route-cand" data-route="' + id + '">' + routePath(City.routes[id].pts, 'route--cool') + '</g>');
      });
    } else if (o.cool) {
      out.push(routePath(City.routes[o.cool].pts, 'route--cool'));
    }
    if (o.access) out.push(routePath(City.accessible.pts, 'route--access'));
    out.push('</g>');

    if (o.access) {
      out.push('<g class="access-flags">');
      City.stairs.forEach(function (s) {
        out.push('<path class="flag-seg flag-seg--stairs" d="' + segD(s) + '"/>');
      });
      City.steep.forEach(function (s) {
        out.push('<path class="flag-seg flag-seg--steep" d="' + segD(s) + '"/>');
      });
      out.push('</g><g class="access-badges">');
      City.stairs.forEach(function (s) {
        var x = (s.a[0] + s.b[0]) / 2;
        var y = (s.a[1] + s.b[1]) / 2;
        out.push('<g class="badge badge--stairs"><rect x="' + (x - 26) + '" y="' + (y - 26) + '" width="52" height="52" rx="14"/>' +
          svgIcon('stairs', x, y, 30) + '</g>');
      });
      City.steep.forEach(function (s) {
        var x = (s.a[0] + s.b[0]) / 2;
        var y = (s.a[1] + s.b[1]) / 2;
        out.push('<g class="badge badge--steep"><rect x="' + (x - 26) + '" y="' + (y - 26) + '" width="52" height="52" rx="14"/>' +
          svgIcon('mountain', x, y, 30) + '</g>');
      });
      out.push('</g>');
    }

    if (o.markers) {
      var L = o.labels || {};
      out.push('<g class="marker marker--start"><circle cx="' + City.start[0] + '" cy="' + City.start[1] + '" r="15"/>' +
        '<text x="' + (City.start[0] + 26) + '" y="' + (City.start[1] - 22) + '">' + esc(L.start || '') + '</text></g>');
      out.push('<g class="marker marker--end"><circle cx="' + City.end[0] + '" cy="' + City.end[1] + '" r="15"/>' +
        '<text x="' + (City.end[0] - 26) + '" y="' + (City.end[1] + 44) + '" text-anchor="end">' + esc(L.end || '') + '</text></g>');
    }
    out.push('</svg>');
    return out.join('');
  }

  /** Taller buildings read slightly lighter, so the flat map has some depth. */
  function toneOf(h) { return h < 22 ? 'b1' : h < 28 ? 'b2' : 'b3'; }

  /** Full-stage background city for the title slide (its own finer grid). */
  var BG_BUILDINGS = City.gridBuildings({ x0: -40, y0: -30, x1: 1960, y1: 1110, cellW: 190, cellH: 150, street: 26, hMin: 18, hMax: 44, seed: 11 });
  function titleCity(time) {
    return '<svg class="city city--bg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' +
      '<rect class="city-ground" width="1920" height="1080"/>' +
      '<path class="city-shadows" d="' + shadowD(time, BG_BUILDINGS) + '"/>' +
      '<g class="city-blocks">' + BG_BUILDINGS.map(function (b) {
        return '<polygon class="' + toneOf(b.h * 0.8) + '" points="' + City.polyPoints(b.poly) + '"/>';
      }).join('') + '</g></svg>';
  }

  /** Small top-down sun dial: north up, sun dot at its azimuth, closer to centre when high. */
  function sunDial(cls) {
    var path = [];
    for (var t = 6.6; t <= 21.2; t += 0.2) {
      var s = City.sunAt(t);
      if (s.elevation < 0) continue;
      var p = dialPoint(s);
      path.push(p[0].toFixed(1) + ' ' + p[1].toFixed(1));
    }
    return '<svg class="sundial ' + (cls || '') + '" viewBox="0 0 200 200" aria-hidden="true">' +
      '<circle class="dial-ring" cx="100" cy="100" r="84"/>' +
      '<path class="dial-path" d="M' + path.join('L') + '"/>' +
      '<text class="dial-n" x="100" y="11" text-anchor="middle">N</text>' +
      '<circle class="dial-centre" cx="100" cy="100" r="5"/>' +
      '<g class="dial-sun"><circle r="13"/></g></svg>';
  }

  function dialPoint(sun) {
    var r = 84 * (1 - Math.max(0, sun.elevation) / 90);
    var az = sun.azimuth * Math.PI / 180;
    return [100 + Math.sin(az) * r, 100 - Math.cos(az) * r];
  }

  function setDial(svg, time) {
    if (!svg) return;
    var sun = City.sunAt(time);
    var p = dialPoint(sun);
    var g = svg.querySelector('.dial-sun');
    if (g) g.setAttribute('transform', 'translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ')');
    svg.classList.toggle('is-night', sun.elevation <= 0);
  }

  function europeMap(lisbonLabel) {
    var E = GEO.europe;
    var lx = E.lisbon[0];
    var ly = E.lisbon[1];
    return '<svg class="europe" viewBox="0 0 ' + E.width + ' ' + E.height + '" role="img" aria-label="Map of Europe. EU countries and Great Britain highlighted.">' +
      '<g class="eu-other">' + E.other.map(function (d) { return '<path d="' + d + '"/>'; }).join('') + '</g>' +
      '<g class="eu-covered">' + E.covered.map(function (d) { return '<path d="' + d + '"/>'; }).join('') + '</g>' +
      '<g class="eu-pin"><circle class="eu-pin-pulse" cx="' + lx + '" cy="' + ly + '" r="14"/>' +
      '<circle class="eu-pin-dot" cx="' + lx + '" cy="' + ly + '" r="11"/>' +
      '<text x="' + (lx + 22) + '" y="' + (ly + 44) + '">' + esc(lisbonLabel) + '</text></g></svg>';
  }

  function lisbonGrid() {
    var L = GEO.lisbon;
    var s = L.cell;
    var cells = L.cells.map(function (c) {
      var delay = Math.round((c[0] + c[1]) * 22);
      var k = Math.max(0, Math.min(1, (c[2] - 0.32) / 0.6));
      var op = (0.06 + 0.9 * Math.pow(k, 1.6)).toFixed(2);
      return '<rect x="' + (c[0] * s + 1.5) + '" y="' + (c[1] * s + 1.5) + '" width="' + (s - 3) + '" height="' + (s - 3) +
        '" rx="5" fill-opacity="' + op + '" style="transition-delay:' + delay + 'ms"/>';
    }).join('');
    return '<svg class="lisbon" viewBox="0 0 ' + L.width + ' ' + L.height + '" aria-hidden="true">' +
      '<g class="lx-cells">' + cells + '</g>' +
      '<g class="lx-parishes">' + L.parishes.map(function (d) { return '<path d="' + d + '"/>'; }).join('') + '</g></svg>';
  }

  function qrSvg(text) {
    if (typeof window.qrcode !== 'function') return '';
    var qr = window.qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var n = qr.getModuleCount();
    var q = 3;
    var bands = 6;
    var groups = [];
    for (var b = 0; b < bands; b++) groups.push('');
    for (var r = 0; r < n; r++) {
      var band = Math.min(bands - 1, Math.floor(r / n * bands));
      for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) groups[band] += 'M' + (c + q) + ' ' + (r + q) + 'h1v1h-1z';
      }
    }
    return '<svg class="qr" viewBox="0 0 ' + (n + q * 2) + ' ' + (n + q * 2) + '" role="img" aria-label="QR code to ' + esc(text) + '" shape-rendering="crispEdges">' +
      '<rect class="qr-bg" width="' + (n + q * 2) + '" height="' + (n + q * 2) + '" rx="2"/>' +
      groups.map(function (d, i) { return '<path class="qr-band" style="transition-delay:' + (i * 90) + 'ms" d="' + d + '"/>'; }).join('') +
      '</svg>';
  }

  /* =================================================================
     3. SLIDE RENDERERS
     Each returns { html, steps?, ctrl? }.
     ctrl(el, deck) returns { enter(step), step(step, dir), leave(), final() }.
     Fragments: any element with class "frag" and data-step="n".
     ================================================================= */

  var R = {};

  /* 1. Title ---------------------------------------------------------- */
  R.title = function (s) {
    return {
      html:
        '<div class="title-bg" aria-hidden="true">' + titleCity(16.5) + '</div>' +
        '<div class="title-content">' +
          logo('title-logo') +
          '<h1 class="title-tag">' + fmt(s.title) + '</h1>' +
          '<p class="title-body">' + fmt(s.body) + '</p>' +
          '<p class="title-footer">' + fmt(s.footer) + '</p>' +
        '</div>' +
        '<div class="title-sun" aria-hidden="true">' + sunDial() +
          '<p class="title-clock"><span class="clock-time">16:30</span><span class="clock-label">' + fmt(s.sunLabel) + '</span></p></div>',
      ctrl: function (el) {
        var path = el.querySelector('.city-shadows');
        var dial = el.querySelector('.sundial');
        var clock = el.querySelector('.clock-time');
        var raf = 0;
        var t0 = 0;
        var lastDraw = 0;
        var FROM = 7.5;
        var TO = 20;
        var PERIOD = 70000; // ms for a full morning-to-evening-and-back cycle
        function draw(time) {
          path.setAttribute('d', shadowD(time, BG_BUILDINGS));
          setDial(dial, time);
          clock.textContent = City.formatClock(time);
        }
        function loop(ts) {
          if (!t0) t0 = ts;
          if (ts - lastDraw > 40) { // ~25 fps is plenty for slow shadows
            var ph = ((ts - t0) % PERIOD) / PERIOD;
            var k = 0.5 - 0.5 * Math.cos(ph * Math.PI * 2); // smooth ping-pong
            draw(FROM + (TO - FROM) * k);
            lastDraw = ts;
          }
          raf = requestAnimationFrame(loop);
        }
        return {
          enter: function () {
            if (reduced()) { draw(16.5); return; }
            t0 = 0;
            raf = requestAnimationFrame(loop);
          },
          leave: function () { cancelAnimationFrame(raf); },
          final: function () { cancelAnimationFrame(raf); draw(16.5); }
        };
      }
    };
  };

  /* 2. Problem ------------------------------------------------------- */

            draw(9);

            }, reduced() ? 0 : 700);
            var prev = cancel;
            cancel = function () { clearTimeout(start); prev(); };

          leave: function () { cancel(); },
          final: function () { cancel(); draw(14); }

      }
    };

  /* 5. Thermal Comfort Engine ---------------------------------------- */
  R.engine = function (s) {
    // Diagram coordinates in a 1680 x 580 box
    var cardW = 560;
    var cardH = 96;
    var gap = 25;
    var ex = 1010;
    var ey = 290;
    var er = 135;
    var outX = 1250;
    var outW = 430;
    var outY = [150, 318];
    var outH = 112;
    var html = '<div class="engine">';
    html += '<svg class="engine-links" viewBox="0 0 1680 580" aria-hidden="true">';
    s.signals.forEach(function (sig, i) {
      var y = i * (cardH + gap) + cardH / 2;
      var d = 'M' + cardW + ' ' + y + ' C ' + (cardW + 220) + ' ' + y + ', ' + (ex - er - 170) + ' ' + ey + ', ' + (ex - er) + ' ' + ey;
      html += '<g class="frag frag--fade" data-step="' + (i + 1) + '"><path class="link" d="' + d + '"/><path class="link-flow" d="' + d + '"/></g>';
    });
    outY.forEach(function (oy) {
      var y = oy + outH / 2;
      var d = 'M' + (ex + er) + ' ' + ey + ' C ' + (ex + er + 70) + ' ' + ey + ', ' + (outX - 70) + ' ' + y + ', ' + outX + ' ' + y;
      html += '<g class="frag frag--fade" data-step="6"><path class="link link--out" d="' + d + '"/><path class="link-flow link-flow--out" d="' + d + '"/></g>';
    });
    html += '</svg>';
    s.signals.forEach(function (sig, i) {
      html += '<div class="sig card frag" data-step="' + (i + 1) + '" style="top:' + (i * (cardH + gap)) + 'px;width:' + cardW + 'px;height:' + cardH + 'px">' +
        '<span class="sig-num">' + (i + 1) + '</span><span class="icon-badge icon-badge--sm">' + icon(sig.icon) + '</span>' +
        '<span class="sig-text"><strong>' + fmt(sig.title) + '</strong><small>' + fmt(sig.text) + '</small></span></div>';
    });
    html += '<div class="engine-core" style="left:' + (ex - er) + 'px;top:' + (ey - er) + 'px;width:' + (er * 2) + 'px;height:' + (er * 2) + 'px">' +
      '<span class="engine-ring"></span>' + icon('engine', 'engine-icon') + '<strong>' + fmt(s.engine.title) + '</strong></div>';
    html += '<p class="engine-caption frag" data-step="6" style="left:' + (ex - 230) + 'px;top:' + (ey + er + 20) + 'px">' +
      '<span class="sig-num">6</span>' + fmt(s.engine.text) + '</p>';
    s.outputs.forEach(function (o, i) {
      html += '<div class="out card frag" data-step="6" style="left:' + outX + 'px;top:' + outY[i] + 'px;width:' + outW + 'px;height:' + outH + 'px">' +
        '<span class="icon-badge icon-badge--sm icon-badge--solid">' + icon(o.icon) + '</span><strong>' + fmt(o.title) + '</strong></div>';
    });
    html += '<p class="engine-footer frag" data-step="6" style="left:' + outX + 'px;top:' + (outY[1] + outH + 40) + 'px;width:' + outW + 'px">' + fmt(s.footer) + '</p>';
    html += '</div>';
    return { html: head(s, 'slide-head--row') + html };
  };

  var uid = 0;
  R.heatsmart = function (s) {
    var t0 = s.presets[0].time;
    var sid = 'hs-slider-' + (++uid);
    var presets = s.presets.map(function (p, i) {
      return '<button type="button" class="pill preset" data-step-target="' + i + '" data-time="' + p.time + '">' +
        esc(p.label) + ' <small>' + City.formatClock(p.time) + '</small></button>';
    }).join('');
    return {
      steps: s.presets.length - 1,
      html:
        '<div class="split">' +
          '<div class="split-text">' + head(s) +
            '<div class="time-card card" data-no-nav>' +
              '<div class="time-top">' + sunDial('sundial--hs') +
                '<div class="time-read"><span class="time-big">' + City.formatClock(t0) + '</span><span class="time-phrase"></span></div></div>' +
              '<label class="time-label" for="' + sid + '">' + fmt(s.sliderLabel) + '</label>' +
              '<input id="' + sid + '" class="time-slider" type="range" min="420" max="1230" step="5" value="' + Math.round(t0 * 60) + '">' +
              '<div class="presets">' + presets + '</div>' +
            '</div>' +
          '</div>' +
          '<figure class="map-card">' +
            cityMap({ time: t0, fast: true, cool: 'all', markers: true, labels: { start: byId('solution').start, end: byId('solution').end } }) +
            '<span class="map-chip map-chip--note">' + icon('info-circle') + fmt(C.meta.illustration) + '</span>' +
            '<div class="map-legend">' +
              '<span class="lg lg--cool"><i></i>' + fmt(s.legendCool) + '</span>' +
              '<span class="lg lg--fast"><i></i>' + fmt(s.legendFast) + '</span>' +
              '<span class="lg lg--shade"><i></i>' + fmt(s.legendShade) + '</span>' +
            '</div>' +
            '<figcaption class="map-caption">' + fmt(s.caption) + '</figcaption>' +
          '</figure>' +
        '</div>',
      ctrl: function (el) {
        var shadows = el.querySelector('.city-shadows');
        var slider = el.querySelector('.time-slider');
        var big = el.querySelector('.time-big');
        var phrase = el.querySelector('.time-phrase');
        var dial = el.querySelector('.sundial');
        var cands = el.querySelectorAll('.route-cand');
        var presetBtns = el.querySelectorAll('.preset');
        var current = t0;
        var rec = null;
        var cancel = function () {};

        function phraseFor(time) {
          var p = s.sunPhrases;
          if (time < 11.5) return p.morning;
          if (time < 15) return p.midday;
          if (time < 19) return p.afternoon;
          return p.evening;
        }

        function draw(time) {
          current = time;
          shadows.setAttribute('d', shadowD(time));
          big.textContent = City.formatClock(time);
          phrase.textContent = phraseFor(time);
          setDial(dial, time);
          slider.value = Math.round(time * 60);
          var res = City.coolerAt(time);
          // hysteresis: only switch when another street is clearly shadier
          if (!rec || (res.id !== rec && res.scores[res.id] > (res.scores[rec] || 0) + 0.02)) rec = res.id;
          Array.prototype.forEach.call(cands, function (g) {
            g.classList.toggle('is-rec', g.getAttribute('data-route') === rec);
          });
          Array.prototype.forEach.call(presetBtns, function (b) {
            b.classList.toggle('is-active', Math.abs(parseFloat(b.getAttribute('data-time')) - time) < 0.05);
          });
        }

        function goTime(time, instant) {
          cancel();
          if (instant) { rec = null; draw(time); return; }
          cancel = tween(current, time, 1100, draw);
        }

        slider.addEventListener('input', function () {
          cancel();
          draw(parseInt(slider.value, 10) / 60);
        });
        // release focus after dragging so clicker / arrow keys go back to the deck
        slider.addEventListener('pointerup', function () { slider.blur(); });
        slider.addEventListener('change', function () { if (!slider.matches(':focus-visible')) slider.blur(); });
        Array.prototype.forEach.call(presetBtns, function (b) {
          b.addEventListener('click', function (e) {
            e.stopPropagation();
            goTime(parseFloat(b.getAttribute('data-time')));
            if (e.detail) b.blur();
          });
        });

        return {
          enter: function (step) { goTime(s.presets[step].time, true); },
          step: function (step) { goTime(s.presets[step].time); },
          leave: function () { cancel(); },
          final: function () { goTime(s.presets[s.presets.length - 1].time, true); }
        };
      }
    };
  };
